<!doctype html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Siden finnes ikke | Johannes Støen</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #020617;
      color: #e5e7eb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: grid;
      place-items: center;
    }
    .wrap { text-align: center; padding: 2rem; }
    .code {
      font-size: 5rem;
      font-weight: 700;
      color: #38bdf8;
      line-height: 1;
      margin-bottom: 1rem;
      letter-spacing: -0.03em;
    }
    .msg { font-size: 1.1rem; color: #9ca3af; margin-bottom: 2.5rem; }
    a {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.6rem 1.4rem;
      border-radius: 999px;
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #38bdf8;
      text-decoration: none;
      font-size: 0.9rem;
      transition: background 0.15s ease;
    }
    a:hover { background: rgba(56, 189, 248, 0.08); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <p class="msg">Siden finnes ikke.</p>
    <a href="/">← Tilbake til forsiden</a>
  </div>
</body>
</html>
